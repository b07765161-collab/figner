```html
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f3f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      box-shadow: 0 4px 15px #0002;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 6px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      background: #4285f4;
      color: white;
      border: none;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2 id="title">Вхід на сайт</h2>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Тестовий Gmail"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Тестовий пароль"
        required
      >

      <button type="submit">Увійти</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      // Демонстрація без збирання чи надсилання паролів.
      form.hidden = true;
      document.getElementById("title").textContent = "Успішно!";
      message.textContent = "Демонстраційний вхід завершено.";
    });
  </script>
</body>
</html>
```
